
name: Green Hell Coach APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
    
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android source
        run: |
          mkdir -p app/src/main/java/de/greenhell/coach
          mkdir -p app/src/main/res
          cp App/build.gradle app/build.gradle
          cp App/Src/Main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp App/Src/Main/Java/De/Green_hell/Coach/*.java app/src/main/java/de/greenhell/coach/
          cp -a App/Src/Main/res/. app/src/main/res/

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: green-hell-coach-debug-apk
          path: app/build/outputs/apk/debug/*.apk

